name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Debug APK
      run: ./gradlew :gpslogger:assembleDebug --no-configuration-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gpslogger-keepalive-debug
        path: gpslogger/build/outputs/apk/debug/*.apk
